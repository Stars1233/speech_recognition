name: Static analysis

env:
  PIP_INDEX_URL: https://pypi.flatt.tech/simple/

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        - name: Run flake8
          run: make lint
