name: Static analysis

env:
  PIP_INDEX_URL: https://pypi.flatt.tech/simple/

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - name: Run flake8
          run: make lint
